# Canonical per-model tracking-linkage tuning values, extracted from
# particle-tracking/tracker_configs.py's write_rfdetr_config/write_lodestar_config
# (the values actually used for real per-model production comparison runs via
# run_tracking.py/model_comparison.py). Single source of truth for both
# tracker_configs.py and verification/benchmark.py -- see this package's README.
#
# trackpy (verification's classical blob detector) has no track.py-side model_type
# of its own -- unlike rf-detr/lodestar/yolo, tracker_configs.py's writers never
# generate a config for it. It has its own tuned entry below anyway (U6), keyed
# by the same "trackpy" model_type string benchmark.py already uses, so its
# tracking-linkage tuning isn't silently coupled to rf-detr's.
#
# adaptive_stop/adaptive_step are NOT per-model-tuned in tracker_configs.py's
# writers (a pre-existing gap -- direct track.py runs against
# particle-tracking/config.yaml's own static tracking: block already set these,
# but the per-model configs tracker_configs.py generates for
# run_tracking.py/model_comparison.py never did). Both models carry the same
# values here, matching particle-tracking/config.yaml's established defaults --
# without them, trackpy's exact linker raises SubnetOversizeException on dense
# scenes (confirmed on the ~1446-particle/frame continuous-force benchmark
# dataset) instead of falling back to a smaller search_range.

# lost_track_buffer/minimum_consecutive_frames/track_activation_threshold
# (ByteTrack's tuning, not trackpy's) were swept directly against this repo's
# real dataset (continuous_force_1500_5.0.lammpstrj, 151 frames, ~1446
# particles/frame, ~11px nearest-neighbor spacing -- see
# docs/plans/2026-08-18-001-feat-bytetrack-tracking-support-plan.md), not
# carried forward unmeasured. A 3x2x2 grid (lost_track_buffer in
# {30,60,120}, minimum_consecutive_frames in {1,3}, track_activation_threshold
# in {0.1,0.3}) was run against rf-detr's and yolo's real detections
# independently; both converged on the identical optimum
# (lost_track_buffer=30, minimum_consecutive_frames=1,
# track_activation_threshold=0.3) -- rf-detr: MOTA 0.397->0.400, IDF1
# 0.373->0.389; yolo: MOTA 0.359->0.371, IDF1 0.313->0.354 vs. the prior
# unmeasured 60/1/0.1 defaults. That two independently-swept detectors landed
# on the same optimum suggests it's primarily a property of this scene's
# density, not detector-specific -- a lower lost_track_buffer and higher
# track_activation_threshold both reduce identity confusion in this crowded
# a scene (holding a lost track too long, or accepting low-confidence
# detections, both increase the chance of associating the wrong nearby
# particle). Not independently swept for lodestar/trackpy given time
# constraints; applied here too as the best available evidence rather than
# guessing, matching this file's own adaptive_stop/adaptive_step precedent
# for values carried across models without per-model measurement.

rf-detr:
  search_range: 25
  memory: 5
  stub_filter: 90  # briefly lowered to 6 (U6) to work around trackpy falling back to
                    # this value and getting zeroed out completely -- trackpy now has
                    # its own independent entry below instead (the actual fix), so
                    # rf-detr's own value never needed to change. Reverted back to 90,
                    # its only empirically-grounded value (see
                    # dataset-profiles/stress-test-results.md): rf-detr's own detection
                    # density (~900-1500/frame) sustains long unbroken tracks unlike
                    # yolo/lodestar/trackpy's much shorter ones, so it doesn't need
                    # (and shouldn't share) their much lower stub_filter.
  adaptive_stop: 12
  adaptive_step: 0.95
  lost_track_buffer: 30
  minimum_consecutive_frames: 1
  track_activation_threshold: 0.3

lodestar:
  search_range: 20
  memory: 10
  stub_filter: 6
  adaptive_stop: 12
  adaptive_step: 0.95
  lost_track_buffer: 30
  minimum_consecutive_frames: 1
  track_activation_threshold: 0.3

# search_range/memory/adaptive_stop/adaptive_step started from rf-detr's
# tuning (both are box-based deep detectors with internal NMS, unlike
# LodeSTAR's point detections) and haven't been independently swept.
# stub_filter=90 (rf-detr's value) was tried first and measured directly
# against this dataset (verification/verification_output/synthetic_frames,
# 151 frames) with the yolo12m-particles checkpoint at threshold=0.25: it
# filtered out every single trajectory. rf-detr's own detection density
# (~900-1500/frame) sustains long unbroken tracks; this checkpoint's much
# lower recall on this benchmark (~0.21, vs ~0.56 on its own real-data val
# split -- see yolov12/config.yaml) means frequent per-frame misses that
# constantly break trajectories -- confirmed directly: with search_range=
# 3.125 (this run's actual collapsed value, see adaptive_stop/adaptive_step
# above), pre-stub-filter track lengths had max=77 frames (out of 151),
# median=2, p95=15 -- no track ever reaches 90. stub_filter=6 (matching
# lodestar's value, the other detector whose tracks are similarly short-
# lived) keeps 2328 of the 10419 raw tracks rather than zero, while still
# discarding single/double-frame noise blips.
yolo:
  search_range: 25
  memory: 5
  stub_filter: 6
  adaptive_stop: 12
  adaptive_step: 0.95
  lost_track_buffer: 30
  minimum_consecutive_frames: 1
  track_activation_threshold: 0.3

# trackpy previously had no entry here (fell back to rf-detr's tuning above,
# per this file's header comment). Before this entry existed, falling back to
# rf-detr's stub_filter=90 zeroed out every trackpy trajectory (MOTA/IDF1
# both 0.0, 0 fragmentations) -- trackpy's own tracks are much shorter-lived
# than rf-detr's, so rf-detr's value was never appropriate for it. Given its
# own explicit entry now (U6), matching lodestar/yolo's stub_filter=6, so
# rf-detr's tuning stays untouched and decoupled from trackpy's fallback.
trackpy:
  search_range: 25
  memory: 5
  stub_filter: 6
  adaptive_stop: 12
  adaptive_step: 0.95
  lost_track_buffer: 30
  minimum_consecutive_frames: 1
  track_activation_threshold: 0.3
