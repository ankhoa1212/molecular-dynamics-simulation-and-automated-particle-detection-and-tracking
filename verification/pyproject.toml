[project]
name = "verification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tifffile>=2024.1",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "supervision>=0.21",
    "motmetrics>=1.4.0",
    "trackpy>=0.6",
    "opencv-python>=4.9.0",
    # deeptrack==2.0.1 provides scalar-diffraction PSF for render_strategy: deeptrack
    # May require build tools; tests mock the import so CI passes without it
    "deeptrack==2.0.1",
    "trackers-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
trackers-common = { path = "../trackers-common", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
