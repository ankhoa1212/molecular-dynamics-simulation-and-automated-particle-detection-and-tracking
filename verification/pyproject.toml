[project]
name = "verification"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "tifffile>=2024.1",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "supervision>=0.21",
    "motmetrics>=1.4.0",
    "trackpy>=0.6",
    "opencv-python>=4.9.0",
    # scikit-image's structural_similarity backs compare_renders.py's
    # compute_ssim_similarity (render_brightfield_fast vs render_brightfield
    # equivalence, R7). Previously only a transitive dependency via
    # deeptrack -- pinned directly so R7's tests don't silently break if
    # deeptrack's own pin ever drops scikit-image.
    "scikit-image>=0.22",
    # deeptrack==2.0.1 provides scalar-diffraction PSF for render_strategy: deeptrack
    # May require build tools; tests mock the import so CI passes without it
    "deeptrack==2.0.1",
    "trackers-common",
    # detectors_common is needed even for --model-type trackpy: benchmark.py's
    # dataset_profile handling unconditionally lazy-imports
    # detectors_common.dataset_profile/scale_derivation to build the
    # detection-side profile (box_size/nms_distance/tile_size), regardless of
    # which model_type ultimately consumes it. Its own dependencies (numpy,
    # supervision, pyyaml) are already all present here, so this doesn't pull
    # in rf-detr's/particle-tracking's heavier torch-based deps. Found via
    # U7 (docs/plans/2026-08-08-002-feat-particle-scale-calibration-plan.md):
    # running benchmark.py --model-type trackpy with a dataset_profile set
    # failed with ModuleNotFoundError before this was added, even though
    # trackpy itself needs no sibling-project venv (see README.md).
    "detectors-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
trackers-common = { path = "../trackers-common", editable = true }
detectors-common = { path = "../detectors-common", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
