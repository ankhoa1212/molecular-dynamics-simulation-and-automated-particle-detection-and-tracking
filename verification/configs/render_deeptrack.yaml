# render.py config — deeptrack strategy
# Physics-accurate scalar-diffraction PSF via DeepTrack2.
# Requires: uv add deeptrack==2.0.1  (inside verification/)
#
# Usage:
#   uv run python render.py --lammps <path> --config config.deeptrack.yaml

synthetic:
  render_strategy: deeptrack
  image_width: 3200
  image_height: 2200
  output_dir: verification_output/synthetic_frames_deeptrack/

  # Optical parameters — tune to your objective
  psf:
    na: 1.4                     # numerical aperture
    wavelength: 520e-9          # emission wavelength (metres)
    resolution: 65e-9           # pixel size (metres/pixel)
    defocus: 0.0                # Zernike defocus coefficient (waves)
    spherical_aberration: 0.0   # Zernike spherical aberration (waves)

  # Spatially varying background
  background:
    heterogeneity_scale: 50     # spatial scale of background variation (px)
    amplitude: 500              # max background variation (ADU)

  # Per-particle intensity distribution
  particle:
    intensity_distribution: lognormal   # fixed | lognormal
    peak_mean: 40000
    intensity_sigma: 0.3

  # sCMOS noise model
  noise:
    gain_sigma: 0.02            # per-pixel gain variation (fraction of mean gain)
    read_noise: 15.0            # Gaussian read noise std dev (ADU)
