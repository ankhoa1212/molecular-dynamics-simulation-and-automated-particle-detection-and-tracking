# render.py config — randomized strategy
# Procedural Gaussian PSF with per-frame stochastic parameter sampling.
# Increases domain diversity for training data augmentation.
#
# Usage:
#   uv run python render.py --lammps <path> --config config.randomized.yaml

synthetic:
  render_strategy: randomized
  image_width: 3200
  image_height: 2200
  shot_noise: true
  output_dir: verification_output/synthetic_frames_randomized/

  # Per-frame ranges — sampled uniformly each frame
  randomization:
    psf_sigma_range: [3.0, 7.0]          # Gaussian PSF sigma (px)
    peak_range: [20000, 60000]            # particle peak intensity (ADU)
    readout_noise_range: [10.0, 25.0]    # readout noise std dev (ADU)
