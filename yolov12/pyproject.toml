[project]
name = "yolov12"
version = "0.2.0"
description = "machine learning for particle tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.0.0",
    "pyyaml>=6.0",
    "ultralytics>=8.3.0",
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
