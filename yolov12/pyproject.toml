[project]
name = "yolov12"
version = "0.2.0"
description = "machine learning for particle tracking"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mlflow>=2.0.0",
    "pyyaml>=6.0",
    "ultralytics>=8.3.0",
    "torch>=2.5.1",
    "torchvision>=0.20.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# This is a flat layout of top-level scripts (main.py, train.py, ...), not an
# importable package -- explicit py-modules avoids setuptools' flat-layout
# auto-discovery, which errors on multiple top-level modules/dirs (e.g. the
# gitignored runs/, mlruns/ output directories that exist locally but not in
# a fresh checkout).
[tool.setuptools]
py-modules = ["main", "mlflow_utils", "evaluate", "process", "train"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
