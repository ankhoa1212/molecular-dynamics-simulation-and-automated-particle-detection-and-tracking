# Trajectory-analysis pipeline (docs/plans/2026-08-21-001-feat-trajectory-analysis-sim-real-validation-plan.md, U3).
# YOLOv12 + trackpy on the N=200 comparative synthetic video (U1's render output).
input: "../verification/verification_output/trajectory_analysis/synth_N200/frames"

model:
  type: yolo
  checkpoint: ../yolov12/runs/detect/yolo12m-particles/weights/best.pt
  device: "0"

crop:

tiling:
  enabled: false

detection:
  threshold: 0.3

tracking:
  tracker: trackpy
  search_range: 25.0
  memory: 5
  stub_filter: 10
  adaptive_stop: 1.0
  adaptive_step: 0.95

output:
  dir: output/trajectory_analysis/synth_yolo
  save_video: false
  save_trajectory_image: true
