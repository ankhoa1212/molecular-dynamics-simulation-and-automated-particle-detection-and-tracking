# Trajectory-analysis pipeline (docs/plans/2026-08-21-001-feat-trajectory-analysis-sim-real-validation-plan.md, U2).
# RF-DETR + trackpy on the real 5um video. dataset_profile derives
# box_size/nms_distance/tile_size/search_range -- no manual overrides,
# mirroring configs/real_5um_validation.yaml's proven approach.
input: "data/raw/scratch/real_5um_trajectory_analysis/frames_000-150.tif"

dataset_profile: ../dataset-profiles/real-5um.yaml

model:
  type: rf-detr
  checkpoint: ../rf-detr/checkpoints-a40/checkpoint_best_ema.pth
  variant: large
  num_classes: 2
  num_queries: 300
  device: "0"

crop:

tiling:
  enabled: true
  overlap: 100
  nms_threshold: 0.3

detection:
  threshold: 0.3

tracking:
  tracker: trackpy
  memory: 5
  stub_filter: 10
  adaptive_stop: 1.0
  adaptive_step: 0.95

output:
  dir: output/trajectory_analysis/real_rfdetr
  save_video: false
  save_trajectory_image: true
