# Trajectory-analysis pipeline, leakage fix -- see real_2um_test_trajectory_analysis_rfdetr.yaml's
# header comment for why this swaps in "Trial 1 100% Light Intensity_4"
# (RF-DETR/YOLOv12 TEST-split video) in place of the original, TRAIN-split
# "NaCl + 2um PS + Au Cit 100%" clip.
input: "data/raw/scratch/real_2um_test_trajectory_analysis/frames_000-150.tif"

dataset_profile: ../dataset-profiles/real-2um-testsplit.yaml

model:
  type: yolo
  checkpoint: ../yolov12/runs/detect/yolo12m-particles/weights/best.pt
  device: "0"

crop:

tiling:
  enabled: true
  overlap: 100
  nms_threshold: 0.3

detection:
  threshold: 0.3

tracking:
  tracker: trackpy
  memory: 5
  stub_filter: 10
  adaptive_stop: 1.0
  adaptive_step: 0.95

output:
  dir: output/trajectory_analysis/real_2um_test_yolo
  save_video: false
  save_trajectory_image: true
