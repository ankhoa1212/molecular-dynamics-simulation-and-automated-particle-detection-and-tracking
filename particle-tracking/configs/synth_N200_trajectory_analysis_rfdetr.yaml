# Trajectory-analysis pipeline (docs/plans/2026-08-21-001-feat-trajectory-analysis-sim-real-validation-plan.md, U3).
# RF-DETR + trackpy on the N=200 comparative synthetic video (U1's render output).
# No dataset_profile: the synthetic-default.yaml profile is calibrated for the
# denser N~1446 trajectory's spacing, not N=200's -- deriving from it would
# give a mismatched search_range. Frame is 512x512, well within a single
# detector pass, so tiling is unnecessary too.
input: "../verification/verification_output/trajectory_analysis/synth_N200/frames"

model:
  type: rf-detr
  checkpoint: ../rf-detr/checkpoints-a40/checkpoint_best_ema.pth
  variant: large
  num_classes: 2
  num_queries: 300
  device: "0"

crop:

tiling:
  enabled: false

detection:
  threshold: 0.3

tracking:
  tracker: trackpy
  search_range: 25.0
  memory: 5
  stub_filter: 10
  adaptive_stop: 1.0
  adaptive_step: 0.95

output:
  dir: output/trajectory_analysis/synth_rfdetr
  save_video: false
  save_trajectory_image: true
