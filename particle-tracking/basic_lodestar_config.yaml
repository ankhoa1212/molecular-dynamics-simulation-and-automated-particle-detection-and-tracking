# Particle Tracking Configuration — LodeSTAR detector, dim-early-frames scenario (override)
# Complete on its own: uv run track.py --config basic_lodestar_config.yaml
# `extends` auto-merges config.yaml (the base) underneath; only keys that
# differ from it need to be listed here. CLI arguments still override both.
extends: config.yaml

# Input: path to video, TIFF stack, or folder of images
input: "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 100% Light Intensity_3_MMStack_Default.ome.tif"

model:
  type: lodestar
  checkpoint: ../data-setup/models/lodestar_model_15/model.pt

# Tiling: RF-DETR-specific technique for >300-particle frames; not applicable to
# LodeSTAR's per-frame detection. Explicitly off, since the base has it on.
tiling:
  enabled: false

detection:
  # LodeSTAR cutoff uses mode="ratio": fraction of the per-frame max score.
  threshold: 0.1    # from autolabel_2um_lodestar_model_15.json (cutoff)
  alpha: 0.3        # weight score exponent; lower = less selective, better for dim early frames
  nms_distance: 30  # suppress detections within 30px of a higher-scoring one
  fp16: true         # run model in float16

tracking:
  search_range: 10.0   # Trackpy: maximum pixel distance a particle can move between frames
  memory: 20             # Trackpy: number of consecutive frames a particle may be missing
  # Trackpy: discard tracks shorter than this many frames (0 = keep all); tune down if real
  # particles stay in-frame for fewer frames than this (watch track_length_max in metrics.json)
  stub_filter: 3
  adaptive_stop: 1.0     # Trackpy: minimum search_range before giving up
  bridge_gap: 15          # Trackpy: reconnect track fragments separated by at most this many frames
  bridge_radius: 20       # Trackpy: spatial search radius in pixels for gap-closing

output:
  dir: /mnt/d/Particle Tracking Data/2um/lodestar/
  save_trajectory_image: false  # base has this on; not exercised for this scenario

analysis:
  hexatic_order: false  # base has this on; not exercised for this scenario
