# Particle Tracking Configuration — LodeSTAR detector
# All paths are relative to the particle-tracking/ directory unless absolute.
# CLI arguments always override values set here.

# Input: path to video, TIFF stack, or folder of images
input: "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 80% Light Intensity_5_MMStack_Default.ome.tif"

# Dataset scale profile: path to a YAML file with size_px/spacing_px (see
# dataset-profiles/README.md). When set, drives box_size/nms_distance/
# tile_size/search_range/memory derivation for any of those left unset below.
# Unset by default -- no single profile is "live" for every user/dataset.
# dataset_profile: ../dataset-profiles/<your-profile>.yaml

# Model:
model:
  type: lodestar

  checkpoint: ../data-setup/models/lodestar_model_15/model.pt

  device: "0"  # "0" for first GPU, "cpu" for CPU-only

# Detection:
detection:
  # LodeSTAR cutoff uses mode="ratio": fraction of the per-frame max score.
  threshold: 0.1   # from autolabel_2um_lodestar_model_15.json (cutoff)
  alpha: 0.9        # weight score exponent (autolabel default)
  # nms_distance intentionally NOT set here -- leaving it unset lets track.py
  # derive it from dataset_profile's size_px/spacing_px, falling back to
  # today's 30px default (detector_defaults.yaml's canonical lodestar value)
  # if no profile is referenced. Set nms_distance here only to override that
  # derived/default value for a specific investigation -- any value set here
  # always wins.
  # nms_distance: 30  # suppress detections within 30px of a higher-scoring one
  fp16: true        # run model in float16
  # box_size: 40    # detection box side length (px), manual estimate until real PSF
                     # calibration exists for this dataset (see box_size KTD in
                     # docs/plans/2026-08-07-001-fix-lodestar-box-sizing-plan.md)

# Tracking:
tracking:
  tracker: trackpy  # trackpy (default, offline) | bytetrack (online)

  # search_range intentionally NOT set here -- leaving it unset lets track.py
  # derive it from dataset_profile's spacing_px (spacing_px * 0.5), falling
  # back to today's 25.0 default (trackers_common's canonical value) if no
  # profile is referenced. Set search_range here only to override that
  # derived/default value for a specific investigation -- any value set here
  # always wins.
  # search_range: 20.0

  # Trackpy: number of consecutive frames a particle may be missing before its track ends
  memory: 10

  # Trackpy: discard tracks shorter than this many frames (0 = keep all)
  stub_filter: 6

  # Trackpy: use adaptive search in dense scenes (reduces search_range if too many candidates)
  adaptive_stop: 1.0  # minimum search_range before giving up (set to null to disable)
  adaptive_step: 0.95  # multiplicative factor to shrink search_range per attempt

  # ByteTrack: frames to keep a lost track alive before discarding it
  lost_track_buffer: 60

  # ByteTrack: consecutive frames a detection must appear before a track is confirmed
  minimum_consecutive_frames: 1

  # ByteTrack: minimum detection confidence to activate a new track (0.0–1.0)
  track_activation_threshold: 0.1

# Output:
output:
  dir: /mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/lodestar/

  save_video: true  # Save an annotated MP4 with bounding boxes drawn

  # Draw the "#<track_id>" label next to each bounding box in the output video.
  # Off by default since the labels tend to clutter dense scenes.
  video_labels: false

  fps: 30

  # Number of historical frames shown as a trail per trajectory in the output video
  trace_length: 60
