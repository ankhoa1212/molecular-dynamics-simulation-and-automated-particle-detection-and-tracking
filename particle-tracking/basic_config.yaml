# Particle Tracking Configuration — RF-DETR, cropped/basic scenario (override)
# Complete on its own: uv run track.py --config basic_config.yaml
# `extends` auto-merges config.yaml (the base) underneath; only keys that
# differ from it need to be listed here. CLI arguments still override both.
extends: config.yaml

# Input: path to video, TIFF stack, or folder of images
# Resolved relative to this repo's top-level data/ directory -- symlink or
# copy your dataset there (see README.md's "Data & Model Availability"
# section): ln -s /path/to/your/dataset ../data/<name>
input: "../data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 100% Light Intensity_3_MMStack_Default.ome.tif"

# Crop: restrict detection to a region of interest (useful when particle count exceeds the
# model's per-frame detection limit, e.g. RF-DETR's 300-query ceiling).
crop:
  center: true  # centre the crop on the frame
  width: 0.5    # half the frame width  }  together → 1/4 of the original area
  height: 0.5   # half the frame height }

# Tiling: not used at this crop size -- explicitly off, since the base has it on.
tiling:
  enabled: false

detection:
  threshold: 0.01  # Confidence threshold for keeping a detection (0.0–1.0)

tracking:
  search_range: 10.0   # Trackpy: maximum pixel distance a particle can move between frames
  stub_filter: 3        # Trackpy: discard tracks shorter than this many frames (0 = keep all)
  adaptive_stop: 1.0    # Trackpy: minimum search_range before giving up

output:
  # Resolved relative to this repo's top-level data/ directory -- change to
# any output location you prefer.
  dir: ../data/2um/rf-detr/
  save_trajectory_image: false  # base has this on; not used at this crop size

analysis:
  hexatic_order: false  # base has this on; not used at this crop size
