# Particle Tracking Configuration — base
# All paths are relative to the particle-tracking/ directory unless absolute.
# CLI arguments always override values set here.
#
# This is the base config other *_config.yaml files in this directory extend
# from (via their own `extends: config.yaml` key) -- each is still complete
# and standalone on its own (e.g. uv run track.py --config lodestar_config.yaml),
# listing only the keys that differ from this file. --config also accepts an
# explicit --override <file>.yaml to merge any two files together directly.

# Input: path to video, TIFF stack, or folder of images
input: "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 80% Light Intensity_5_MMStack_Default.ome.tif"

# Dataset scale profile: path to a YAML file with size_px/spacing_px (see
# dataset-profiles/README.md). When set, drives box_size/nms_distance/
# tile_size/search_range/memory derivation for any of those left unset below.
# Unset by default -- no single profile is "live" for every user/dataset.
# dataset_profile: ../dataset-profiles/<your-profile>.yaml

# Model:
model:
  type: rf-detr  # rf-detr | yolo | lodestar

  checkpoint: ../rf-detr/checkpoints/checkpoint_best_regular.pth  # model checkpoint
                     # checkpoint_best_ema.pth is from a training run that crashed at epoch 0 (only 449
                     # steps logged, val metrics never ran) and produces ZERO detections on real frames —
                     # do not use it. checkpoint_best_regular.pth is from the May 6 run that completed 20
                     # epochs with val/mAP_50=0.91, recall=0.87, precision=0.94 (see
                     # rf-detr/checkpoints/events.out.tfevents.1778071247.*) and correctly detects all 70/70
                     # particles on a held-out test frame.

  # Only used when model.type is rf-detr
  variant: large  # nano | small | medium | large
  num_classes: 2  # number of classes in the checkpoint (2 = particle/background)
  num_queries: 300  # max detections per frame; must match the trained checkpoint. checkpoint_best_regular
                     # was trained with num_queries=300 (refpoint_embed/query_feat are 300*group_detr=3900
                     # rows) — rfdetr's loader (rfdetr/detr.py:_load_pretrain_weights_into) silently
                     # truncates these to num_queries*group_detr before load_state_dict if this is wrong,
                     # discarding trained queries with no error or warning.

  device: "0"  # "0" for first GPU, "cpu" for CPU-only

# Crop: restrict detection to a region of interest.
# width/height: fraction of frame (0.0–1.0) or absolute pixels (> 1).
# center: true  → crop is centred on the frame; x/y are ignored.
# center: false → x/y set the top-left corner in pixels.
# Set to null (or omit) to process the full frame (use tiling instead for dense scenes).
crop:

# Tiling: split each frame into overlapping tiles and merge detections with NMS.
# Enables the 300-query RF-DETR model to handle frames with >300 particles by
# processing each tile independently (adapts to any input frame size at runtime).
# tile_size: tile edge length in original frame pixels (each tile is resized to model
#            resolution internally); tune so avg particles/tile stays under 300.
# overlap:   pixel overlap between adjacent tiles so boundary particles aren't missed.
# nms_threshold: IoU threshold for deduplicating detections in overlap regions.
tiling:
  enabled: true
  # tile_size intentionally NOT set here -- leaving it unset lets track.py derive
  # it from dataset_profile's spacing_px (clamped to this input's own frame
  # dimensions), falling back to today's 1024 default if no profile is
  # referenced. Set tile_size here only to override that derived/default value
  # for a specific investigation -- any value set here always wins.
  # tile_size: 1024
  overlap: 100
  nms_threshold: 0.3

# Detection:
detection:
  threshold: 0.3  # Confidence threshold for keeping a detection (0.0–1.0)

# Tracking:
tracking:
  tracker: trackpy  # trackpy (default, offline) | bytetrack (online)

  # search_range intentionally NOT set here -- leaving it unset lets track.py
  # derive it from dataset_profile's spacing_px (spacing_px * 0.5), falling
  # back to today's 25.0 default if no profile is referenced. Set search_range
  # here only to override that derived/default value for a specific
  # investigation -- any value set here always wins.
  # search_range: 25.0

  # Trackpy: number of consecutive frames a particle may be missing before its track ends
  memory: 5

  # Trackpy: discard tracks shorter than this many frames (0 = keep all)
  stub_filter: 90

  # Trackpy: use adaptive search in dense scenes (reduces search_range if too many candidates)
  adaptive_stop: 12  # minimum search_range before giving up (set to null to disable)
  adaptive_step: 0.95  # multiplicative factor to shrink search_range per attempt

  # Trackpy: reconnect track fragments separated by at most this many frames (disabled if null)
  bridge_gap: null
  # Trackpy: spatial search radius in pixels for gap-closing (default: 2 × search_range)
  bridge_radius: null

  # ByteTrack: frames to keep a lost track alive before discarding it
  lost_track_buffer: 60

  # ByteTrack: consecutive frames a detection must appear before a track is confirmed
  minimum_consecutive_frames: 1

  # ByteTrack: minimum detection confidence to activate a new track (0.0–1.0)
  track_activation_threshold: 0.1

# Output:
output:
  dir: /mnt/d/Particle Tracking Data/2um/rf-detr-trial/

  save_video: true  # Save an annotated MP4 with bounding boxes drawn

  # Draw the "#<track_id>" label next to each bounding box in the output video.
  # Off by default since the labels tend to clutter dense scenes.
  video_labels: false

  fps: 30

  # Number of historical frames shown as a trail per trajectory in the output video
  trace_length: 60

  # Save a static PNG of every complete trajectory overlaid on the first frame,
  # coloured with a gradient from track start to track end.
  save_trajectory_image: true
  trajectory_colormap: plasma  # any matplotlib colormap (e.g. plasma, viridis, coolwarm)

# Analysis: post-processing steps run after tracking completes
analysis:
  hexatic_order: true  # Compute and save hexatic order parameter plot (requires freud in lammps-scripts/.venv)
