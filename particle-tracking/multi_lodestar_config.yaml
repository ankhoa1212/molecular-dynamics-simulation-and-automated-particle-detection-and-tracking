# Particle Tracking Configuration — LodeSTAR detector, multi-input (override)
# Complete on its own: uv run track.py --config multi_lodestar_config.yaml
# `extends` auto-merges config.yaml (the base) underneath; only keys that
# differ from it need to be listed here. CLI arguments still override both.
extends: config.yaml

# Input: list of TIFF stacks to process; each produces a named subdirectory under output.dir
input:
  - "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 100% Light Intensity_3_MMStack_Default.ome.tif"
  - "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 80% Light Intensity_5_MMStack_Default.ome.tif"
  - "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 80% Light Intensity_6_MMStack_Default.ome.tif"
  - "/mnt/d/Particle Tracking Data/2um-automatic-particle-detection-lodestar-data/2 um Higher Concentration/NaCl + 2um PS + Au Cit 100% Light Intensity Trial 1 Redo_1_MMStack_Default.ome.tif"

model:
  type: lodestar
  checkpoint: ../data-setup/models/lodestar_model_15/model.pt

# Tiling: RF-DETR-specific technique for >300-particle frames; not applicable to
# LodeSTAR's per-frame detection. Explicitly off, since the base has it on.
tiling:
  enabled: false

detection:
  # LodeSTAR cutoff uses mode="ratio": fraction of the per-frame max score.
  threshold: 0.01   # from autolabel_2um_lodestar_model_15.json (cutoff)
  alpha: 0.9         # weight score exponent (autolabel default)
  nms_distance: 30  # suppress detections within 30px of a higher-scoring one
  fp16: true          # run model in float16

tracking:
  search_range: 20.0   # Trackpy: maximum pixel distance a particle can move between frames
  memory: 10             # Trackpy: number of consecutive frames a particle may be missing
  stub_filter: 6          # Trackpy: discard tracks shorter than this many frames (0 = keep all)
  adaptive_stop: 1.0      # Trackpy: minimum search_range before giving up

output:
  dir: /mnt/d/Particle Tracking Data/2um/lodestar/
  save_trajectory_image: false  # base has this on; not exercised for this scenario

analysis:
  hexatic_order: false  # base has this on; not exercised for this scenario
