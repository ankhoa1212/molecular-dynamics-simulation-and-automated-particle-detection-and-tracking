# Particle Tracking Configuration — RF-DETR, multi-input (override)
# Complete on its own: uv run track.py --config multi_config.yaml
# `extends` auto-merges config.yaml (the base) underneath; only keys that
# differ from it need to be listed here. CLI arguments still override both.
extends: config.yaml

# Input: list of TIFF stacks to process; each produces a named subdirectory under output.dir
# Resolved relative to this repo's top-level data/ directory -- symlink or
# copy your dataset there (see README.md's "Data & Model Availability"
# section): ln -s /path/to/your/dataset ../data/<name>
input:
  - "../data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 100% Light Intensity_3_MMStack_Default.ome.tif"
  - "../data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 80% Light Intensity_5_MMStack_Default.ome.tif"
  - "../data/2um-automatic-particle-detection-lodestar-data/2 um Lower Concentration/5 ul Au Citrate + 2.5 ul 1% of 2ul + 2.5 ul pf NaCl Trial 1 80% Light Intensity_6_MMStack_Default.ome.tif"
  - "../data/2um-automatic-particle-detection-lodestar-data/2 um Higher Concentration/NaCl + 2um PS + Au Cit 100% Light Intensity Trial 1 Redo_1_MMStack_Default.ome.tif"

output:
  # Resolved relative to this repo's top-level data/ directory -- change to
# any output location you prefer.
  dir: ../data/2um/rf-detr/
