[project]
name = "rf-detr"
version = "0.1.0"
description = "RF-DETR particle detection training pipeline"
requires-python = ">=3.11"
dependencies = [
    "rfdetr[loggers,train]>=1.1.0",
    "mlflow>=3.12.0",
    "pyyaml>=6.0",
    "supervision>=0.21.0",
    "torch>=2.5.1",
    "torchvision>=0.20.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "tifffile>=2026.3.3",
    "scipy>=1.17.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
